name: Deploy EchoForma to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Sounding America
        working-directory: sounding-america
        run: |
          npm install
          npm run build

      - name: Assemble complete EchoForma site
        shell: bash
        run: |
          set -e
          mkdir -p _site
          shopt -s dotglob nullglob
          for item in *; do
            case "$item" in
              .git|.github|node_modules|sounding-america|_site) continue ;;
            esac
            cp -R "$item" _site/
          done
          mkdir -p _site/sounding-america
          cp -R sounding-america/dist/. _site/sounding-america/
          touch _site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
